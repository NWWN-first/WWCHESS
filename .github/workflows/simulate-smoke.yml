name: Simulate smoke (headless)

on:
  push:
    branches:
      - main
      - 'cursor/**'
  pull_request:
    branches:
      - main
      - 'cursor/**'

jobs:
  simulate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Headless simulate (GAMES=50)
        run: GAMES=50 npm run simulate