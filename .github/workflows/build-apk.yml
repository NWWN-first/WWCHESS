name: Build Android APK & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WWCHESS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-${{ github.run_number }}-${{ github.sha }}
          name: "WWCHESS Fantasy AutoBattler APK (run ${{ github.run_number }})"
          body: |
            ## 🎮 WWCHESS Fantasy AutoBattler 모바일 APK
            
            - **빌드 일시**: ${{ github.event.head_commit.timestamp }}
            - **커밋**: `${{ github.sha }}`
            - **콘텐츠 (GameData 기준)**: 13종 시너지 · 61종 챔피언 · 15종 완성 아이템 · 약 80종 증강
            - **AI**: ONNX Runtime + 인라인 신경망 가중치 (`predictSync` / `predictONNX`)
            - 모바일 가로모드(Landscape) 최적화
            
            ### 📥 다운로드 방법
            아래 Assets의 **`app-debug.apk`**를 클릭하여 스마트폰에 다운로드 후 설치하세요.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
