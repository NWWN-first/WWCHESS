name: Simulate ONNX parity (optional)

on:
  pull_request:
    branches:
      - main
      - 'cursor/**'
    paths:
      - 'src/NeuralBotEngine.ts'
      - 'src/AIBotController.ts'
      - 'scripts/simulate1000.ts'
      - 'public/models/wwchess_bot.onnx'
      - 'public/models/wwchess_bot.onnx.data'
      - '.github/workflows/simulate-onnx-parity.yml'
  workflow_dispatch:
    inputs:
      games:
        description: Number of headless games
        required: false
        default: '50'
        type: string

jobs:
  simulate-onnx-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Headless simulate (GAMES, USE_ONNX_SIM, no KPI gate)
        env:
          GAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.games || '50' }}
          USE_ONNX_SIM: '1'
        run: npm run simulate